<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rubric — Pest Control Scorer</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .step-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .step-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .step-title {
      font-weight: 700;
      font-size: 14px;
    }
    .step-header-text {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'SF Mono', monospace;
      flex: 1;
    }
    .step-card-body { padding: 16px 20px; }

    /* Rules display and edit */
    .rules-pre {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }
    .rules-textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--accent);
      border-radius: 7px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      line-height: 1.7;
      padding: 12px 14px;
      resize: vertical;
      outline: none;
      min-height: 120px;
      display: none;
    }
    .rules-edit-actions {
      display: none;
      gap: 8px;
      margin-top: 10px;
    }
    .rules-edit-actions .btn { width: auto; font-size: 12px; padding: 7px 14px; }

    /* Propose section */
    .propose-section {
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      background: rgba(255,255,255,0.015);
    }
    .propose-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .propose-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .propose-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .propose-input:focus { border-color: var(--accent); }
    .propose-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 9px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .propose-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .propose-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Proposal preview */
    .proposal-box {
      display: none;
      margin-top: 12px;
      border: 1px solid rgba(245,158,11,0.4);
      border-radius: 8px;
      overflow: hidden;
    }
    .proposal-box.show { display: block; }
    .proposal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(245,158,11,0.1);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--amber);
    }
    .proposal-text {
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      background: rgba(245,158,11,0.04);
    }
    .proposal-actions {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(245,158,11,0.06);
      border-top: 1px solid rgba(245,158,11,0.2);
    }
    .proposal-actions .btn { width: auto; font-size: 12px; padding: 7px 14px; }

    /* Version history */
    .history-section {
      border-top: 1px solid var(--border);
    }
    .history-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color 0.15s;
      user-select: none;
    }
    .history-toggle:hover { color: var(--text); }
    .history-toggle .chevron { transition: transform 0.2s; font-size: 10px; }
    .history-toggle.open .chevron { transform: rotate(180deg); }
    .history-list {
      display: none;
      padding: 0 20px 12px;
    }
    .history-list.show { display: block; }
    .history-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .history-item:last-child { border-bottom: none; }
    .history-meta { flex: 1; min-width: 0; }
    .history-time { color: var(--text-muted); font-size: 11px; margin-bottom: 2px; }
    .history-preview {
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-restore-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text-muted);
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .history-restore-btn:hover { border-color: var(--accent); color: var(--accent); }
    .history-empty { color: var(--text-muted); font-size: 12px; font-style: italic; padding: 8px 0; }

    .spinner-sm {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .save-indicator {
      display: none;
      font-size: 12px;
      color: var(--green);
      align-items: center;
      gap: 4px;
    }
    .save-indicator.show { display: inline-flex; }
  </style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-brand">🐛 <span>Pest</span>Score</a>
  <a href="/">Upload</a>
  <a href="/dashboard.html">Dashboard</a>
  <a href="/rubric.html" class="active">Rubric</a>
</nav>

<div class="page" style="max-width: 800px;">
  <h1>Scoring Rubric</h1>
  <p class="subtitle">Edit rules per step. Use plain English to propose a change and Claude will rewrite the step for you.</p>

  <div id="stepsContainer">
    <p style="color:var(--text-muted)">Loading rubric…</p>
  </div>
</div>

<script>
let steps = [];

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return `${Math.floor(diff / 86400)}d ago`;
}

function escapeHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderSteps() {
  const container = document.getElementById('stepsContainer');
  container.innerHTML = steps.map((step, idx) => `
    <div class="step-card" id="card-${step.id}">
      <div class="step-card-header">
        <div>
          <div class="step-title">${escapeHtml(step.name)}</div>
          <div class="step-header-text">${escapeHtml(step.header)}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-shrink:0">
          <span class="save-indicator" id="saved-${step.id}">✓ Saved</span>
          <button class="btn btn-sm btn-ghost" onclick="toggleEdit('${step.id}')" id="edit-btn-${step.id}">Edit</button>
        </div>
      </div>

      <div class="step-card-body">
        <pre class="rules-pre" id="rules-pre-${step.id}">${escapeHtml(step.rules)}</pre>
        <textarea class="rules-textarea" id="rules-ta-${step.id}">${escapeHtml(step.rules)}</textarea>
        <div class="rules-edit-actions" id="edit-actions-${step.id}">
          <button class="btn btn-sm" onclick="saveRules('${step.id}')">Save Changes</button>
          <button class="btn btn-sm btn-ghost" onclick="cancelEdit('${step.id}')">Cancel</button>
        </div>
      </div>

      <div class="propose-section">
        <div class="propose-label">Propose a Change with Claude</div>
        <div class="propose-row">
          <input type="text" class="propose-input" id="propose-input-${step.id}"
            placeholder="e.g. don't deduct if customer volunteers the information"
            onkeydown="if(event.key==='Enter') proposeChange('${step.id}')">
          <button class="propose-btn" id="propose-btn-${step.id}" onclick="proposeChange('${step.id}')">
            Ask Claude
          </button>
        </div>
        <div class="proposal-box" id="proposal-box-${step.id}">
          <div class="proposal-header">
            Proposed Update
            <span style="font-weight:400;color:var(--text-muted);text-transform:none;letter-spacing:0">Review before saving</span>
          </div>
          <pre class="proposal-text" id="proposal-text-${step.id}"></pre>
          <div class="proposal-actions">
            <button class="btn btn-sm" onclick="applyProposal('${step.id}')">Apply Changes</button>
            <button class="btn btn-sm btn-ghost" onclick="discardProposal('${step.id}')">Discard</button>
          </div>
        </div>
      </div>

      <div class="history-section" id="history-section-${step.id}" ${!step.history || !step.history.length ? 'style="display:none"' : ''}>
        <div class="history-toggle" id="history-toggle-${step.id}" onclick="toggleHistory('${step.id}')">
          Version History (${(step.history || []).length})
          <span class="chevron">▼</span>
        </div>
        <div class="history-list" id="history-list-${step.id}">
          ${renderHistory(step)}
        </div>
      </div>
    </div>
  `).join('');
}

function renderHistory(step) {
  if (!step.history || !step.history.length) {
    return '<div class="history-empty">No history yet.</div>';
  }
  return step.history.map((v, i) => `
    <div class="history-item">
      <div class="history-meta">
        <div class="history-time">${timeAgo(v.savedAt)}</div>
        <div class="history-preview">${escapeHtml(v.rules.replace(/\n/g, ' ').substring(0, 120))}…</div>
      </div>
      <button class="history-restore-btn" onclick="revertStep('${step.id}', ${i})">Restore</button>
    </div>
  `).join('');
}

function toggleEdit(id) {
  const btn = document.getElementById(`edit-btn-${id}`);
  const pre = document.getElementById(`rules-pre-${id}`);
  const ta = document.getElementById(`rules-ta-${id}`);
  const actions = document.getElementById(`edit-actions-${id}`);
  const isEditing = ta.style.display === 'block';

  if (isEditing) {
    cancelEdit(id);
  } else {
    const step = steps.find(s => s.id === id);
    ta.value = step.rules;
    pre.style.display = 'none';
    ta.style.display = 'block';
    actions.style.display = 'flex';
    btn.textContent = 'Cancel';
    ta.focus();
  }
}

function cancelEdit(id) {
  const btn = document.getElementById(`edit-btn-${id}`);
  const pre = document.getElementById(`rules-pre-${id}`);
  const ta = document.getElementById(`rules-ta-${id}`);
  const actions = document.getElementById(`edit-actions-${id}`);
  pre.style.display = 'block';
  ta.style.display = 'none';
  actions.style.display = 'none';
  btn.textContent = 'Edit';
}

async function saveRules(id, rulesText) {
  const step = steps.find(s => s.id === id);
  const newRules = rulesText !== undefined
    ? rulesText
    : document.getElementById(`rules-ta-${id}`).value.trim();

  try {
    const res = await fetch(`/api/rubric/steps/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rules: newRules })
    });
    if (!res.ok) throw new Error();
    const data = await res.json();

    // Update local state
    const idx = steps.findIndex(s => s.id === id);
    steps[idx] = data.step;

    // Update display
    document.getElementById(`rules-pre-${id}`).textContent = newRules;
    cancelEdit(id);

    // Update history section
    const histSection = document.getElementById(`history-section-${id}`);
    histSection.style.display = 'block';
    document.getElementById(`history-toggle-${id}`).querySelector('.chevron').parentElement
      .innerHTML = `Version History (${data.step.history.length}) <span class="chevron">▼</span>`;
    document.getElementById(`history-list-${id}`).innerHTML = renderHistory(data.step);

    // Flash saved indicator
    const indicator = document.getElementById(`saved-${id}`);
    indicator.classList.add('show');
    setTimeout(() => indicator.classList.remove('show'), 2500);

  } catch {
    alert('Failed to save. Please try again.');
  }
}

async function proposeChange(id) {
  const input = document.getElementById(`propose-input-${id}`);
  const changeRequest = input.value.trim();
  if (!changeRequest) { input.focus(); return; }

  const btn = document.getElementById(`propose-btn-${id}`);
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span> Asking Claude…';

  try {
    const res = await fetch(`/api/rubric/steps/${id}/propose`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ changeRequest })
    });
    if (!res.ok) throw new Error();
    const data = await res.json();

    document.getElementById(`proposal-text-${id}`).textContent = data.proposed;
    document.getElementById(`proposal-box-${id}`).classList.add('show');
    input.value = '';

  } catch {
    alert('Claude request failed. Please try again.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Ask Claude';
  }
}

async function applyProposal(id) {
  const proposed = document.getElementById(`proposal-text-${id}`).textContent;
  await saveRules(id, proposed);
  discardProposal(id);
}

function discardProposal(id) {
  document.getElementById(`proposal-box-${id}`).classList.remove('show');
  document.getElementById(`proposal-text-${id}`).textContent = '';
}

function toggleHistory(id) {
  const toggle = document.getElementById(`history-toggle-${id}`);
  const list = document.getElementById(`history-list-${id}`);
  const open = list.classList.contains('show');
  list.classList.toggle('show', !open);
  toggle.classList.toggle('open', !open);
}

async function revertStep(id, versionIndex) {
  if (!confirm('Restore this version? The current rules will be saved to history.')) return;
  try {
    const res = await fetch(`/api/rubric/steps/${id}/revert`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ versionIndex })
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    const idx = steps.findIndex(s => s.id === id);
    steps[idx] = data.step;
    renderSteps();
    setTimeout(() => {
      const indicator = document.getElementById(`saved-${id}`);
      if (indicator) { indicator.classList.add('show'); setTimeout(() => indicator.classList.remove('show'), 2500); }
    }, 50);
  } catch {
    alert('Failed to restore. Please try again.');
  }
}

async function load() {
  const res = await fetch('/api/rubric/steps');
  steps = await res.json();
  renderSteps();
}

load();
</script>
</body>
</html>
