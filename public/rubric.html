<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rubric Editor — Pest Control Scorer</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .rubric-textarea {
      width: 100%;
      min-height: 600px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
      font-size: 12.5px;
      line-height: 1.7;
      padding: 16px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }
    .rubric-textarea:focus { border-color: var(--accent); }
    .rubric-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      align-items: center;
    }
    .rubric-actions .btn { width: auto; }
    .save-status {
      font-size: 13px;
      margin-left: 8px;
    }
    .save-status.success { color: var(--green); }
    .save-status.error { color: var(--red); }
    .hint {
      background: rgba(79,122,255,0.08);
      border: 1px solid rgba(79,122,255,0.2);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .hint code {
      background: rgba(79,122,255,0.15);
      color: var(--accent);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: 'SF Mono', monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-brand">🐛 <span>Pest</span>Score</a>
  <a href="/">Upload</a>
  <a href="/dashboard.html">Dashboard</a>
  <a href="/rubric.html" class="active">Rubric</a>
</nav>

<div class="page" style="max-width: 960px;">
  <h1>Rubric Editor</h1>
  <p class="subtitle">Edit the scoring prompt sent to Claude. Changes take effect on the next upload.</p>

  <div class="hint">
    Use <code>{DISPOSITION}</code> where the call disposition should appear, and <code>{TRANSCRIPT}</code> where the transcript should be inserted. Both placeholders are required.
  </div>

  <div class="card">
    <textarea class="rubric-textarea" id="rubricText" spellcheck="false"></textarea>
    <div class="rubric-actions">
      <button class="btn" id="saveBtn">Save Changes</button>
      <button class="btn btn-ghost" id="resetBtn">Reset to Default</button>
      <span class="save-status" id="saveStatus"></span>
    </div>
  </div>
</div>

<script>
const textarea = document.getElementById('rubricText');
const saveStatus = document.getElementById('saveStatus');

async function load() {
  const res = await fetch('/api/rubric');
  const data = await res.json();
  textarea.value = data.rubric;
}

function setStatus(msg, type) {
  saveStatus.textContent = msg;
  saveStatus.className = 'save-status ' + type;
  if (type === 'success') setTimeout(() => { saveStatus.textContent = ''; }, 3000);
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const rubric = textarea.value.trim();
  if (!rubric.includes('{DISPOSITION}') || !rubric.includes('{TRANSCRIPT}')) {
    setStatus('Missing {DISPOSITION} or {TRANSCRIPT} placeholder', 'error');
    return;
  }
  try {
    const res = await fetch('/api/rubric', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rubric })
    });
    if (!res.ok) throw new Error();
    setStatus('Saved successfully', 'success');
  } catch {
    setStatus('Save failed', 'error');
  }
});

document.getElementById('resetBtn').addEventListener('click', async () => {
  if (!confirm('Reset to default rubric? Any custom changes will be lost.')) return;
  try {
    const res = await fetch('/api/rubric/reset', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error();
    textarea.value = data.rubric;
    setStatus('Reset to default', 'success');
  } catch {
    setStatus('Reset failed', 'error');
  }
});

load();
</script>
</body>
</html>
